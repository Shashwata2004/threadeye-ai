[project]
name = "threadeye-evidence-assistant"
version = "0.9.0"
description = "Authorized grounded evidence answering for ThreadEye AI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
vector = [
  "fastembed==0.9.1",
  "pgvector==0.5.1",
  "psycopg[binary]==3.3.8",
]
mcp = [
  "cryptography==50.0.2",
  "mcp==2.3.0",
  "PyJWT==2.15.1",
]
ui = [
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[project.scripts]
threadeye-evidence = "threadeye_evidence.__main__:main"
threadeye-evidence-mcp = "threadeye_evidence.mcp.server:main"
threadeye-evidence-mcp-http = "threadeye_evidence.mcp.http_server:main"
threadeye-evidence-mcp-verify = "threadeye_evidence.mcp.verify_client:main"
threadeye-evidence-mcp-http-verify = "threadeye_evidence.mcp.verify_http:main"
threadeye-evidence-mcp-db-setup = "threadeye_evidence.mcp.database:setup_main"
threadeye-evidence-ui = "threadeye_evidence.ui.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"threadeye_evidence.ui" = ["static/*"]
