[project]
name = "threadeye-evidence-assistant"
version = "0.2.0"
description = "Read-only evidence inventory foundation for ThreadEye AI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
threadeye-evidence = "threadeye_evidence.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
