# Developer convenience, run from backend/:
#   THREADEYE_DATABASE_URL=postgresql+psycopg://... uv run alembic revision --autogenerate -m "..."
# The URL is read from THREADEYE_DATABASE_URL (threadeye/db/migrations/env.py).
# At runtime, `threadeye migrate` builds this configuration in code (threadeye/db/migrate.py).
[alembic]
script_location = threadeye/db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
