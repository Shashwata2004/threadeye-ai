name: Demo smoke check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check health, login and receiving access
        env:
          WEB_BASE: ${{ vars.THREADEYE_DEMO_WEB || 'https://threadeye-web.vercel.app' }}
          DEMO_PASSWORD: ${{ secrets.THREADEYE_DEMO_PASSWORD }}
        run: |
          test -n "$DEMO_PASSWORD"
          curl --fail --silent --show-error --max-time 45 "$WEB_BASE/health"
          python3 -c 'import os,json; print(json.dumps({"username":"store","password":os.environ["DEMO_PASSWORD"]}))' > "$RUNNER_TEMP/login.json"
          curl --fail --silent --show-error --max-time 45 -c "$RUNNER_TEMP/cookies" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/login.json" "$WEB_BASE/api/v1/auth/login" > /dev/null
          curl --fail --silent --show-error --max-time 45 -b "$RUNNER_TEMP/cookies" "$WEB_BASE/api/v1/lots" > /dev/null
          rm "$RUNNER_TEMP/login.json" "$RUNNER_TEMP/cookies"
